<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vidgrab</title>
<style>
  :root {
    --bg: #0b0f17; --panel: #121826; --line: #232c3d; --text: #e6e9ef; --muted: #8a94a7;
    --accent: #7c3aed; --accent-hover: #6d28d9; --ok: #22c55e; --err: #f87171; --warn: #f59e0b;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f7fb; --panel: #ffffff; --line: #e3e6ee; --text: #151a24; --muted: #5d6678;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .folder { color: var(--muted); font-size: 12px; word-break: break-all; }
  form { display: flex; gap: 8px; margin: 20px 0 8px; flex-wrap: wrap; }
  input[type=url] {
    flex: 1 1 320px; height: 44px; padding: 0 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 14px;
  }
  input[type=url]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  select, button {
    height: 44px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); padding: 0 12px; font-size: 14px; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 0 20px; }
  button.primary:hover { background: var(--accent-hover); }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 20px; }
  .error-banner { color: var(--err); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; border: 1px dashed var(--line); border-radius: 12px; }
  .job { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .url { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 10px 0 8px; }
  .fill { height: 100%; background: var(--accent); width: 0; transition: width .4s ease; }
  .fill.indeterminate { width: 30%; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
  .job[data-status=done] .fill { background: var(--ok); }
  .job[data-status=error] .fill { background: var(--err); }
  .job[data-status=paused] .fill { background: var(--warn); }
  .stats { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; display: flex; gap: 14px; flex-wrap: wrap; }
  .status { font-size: 12px; font-weight: 600; text-transform: capitalize; flex-shrink: 0; }
  .status.error { color: var(--err); } .status.done { color: var(--ok); } .status.paused { color: var(--warn); }
  .err { color: var(--err); font-size: 12px; margin-top: 6px; }
  .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .actions button, .actions a {
    height: 30px; font-size: 12px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--text); text-decoration: none; display: inline-flex; align-items: center; cursor: pointer;
  }
  .actions button:hover, .actions a:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>vidgrab</h1>
    <span class="folder" id="folder"></span>
  </header>
  <form id="add">
    <input type="url" id="url" placeholder="Paste a video link: YouTube, Vimeo, X, Reddit, a direct .mp4 or .m3u8..." required>
    <select id="connections" aria-label="Connections per file">
      <option value="4">4 connections</option>
      <option value="8" selected>8 connections</option>
      <option value="16">16 connections</option>
    </select>
    <button class="primary" type="submit">Download</button>
  </form>
  <p class="hint">Files are split into parts and fetched in parallel. Paused downloads resume where they stopped. DRM-protected video is not supported.</p>
  <div class="error-banner" id="banner" role="alert"></div>
  <section id="jobs"></section>
</main>
<script>
const api = (path, opts) => fetch(`/api${path}`, opts).then(async (r) => {
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    throw new Error(typeof body.detail === 'string' ? body.detail : `HTTP ${r.status}`);
  }
  return r.json();
});

const human = (n) => {
  if (n == null) return '?';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(i ? 1 : 0)} ${units[i]}`;
};
const clock = (s) => s == null ? '' : s >= 3600
  ? `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m`
  : `${Math.floor(s / 60)}m ${String(Math.floor(s % 60)).padStart(2, '0')}s`;
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const banner = document.getElementById('banner');
const list = document.getElementById('jobs');

function statusLabel(job) {
  if (job.status === 'running') return job.phase || 'starting';
  return job.status;
}

function render(jobs) {
  if (!jobs.length) {
    list.innerHTML = '<div class="empty">No downloads yet. Paste a link above.</div>';
    return;
  }
  list.innerHTML = jobs.map((job) => {
    const pct = job.total ? Math.min(100, job.downloaded / job.total * 100) : 0;
    const unknown = job.status === 'running' && !job.total;
    const actions = [];
    if (job.status === 'running' || job.status === 'queued') {
      actions.push(`<button data-act="pause">Pause</button>`, `<button data-act="cancel">Cancel</button>`);
    }
    if (['paused', 'error', 'canceled'].includes(job.status)) actions.push(`<button data-act="resume">${job.status === 'paused' ? 'Resume' : 'Retry'}</button>`);
    if (job.status === 'done') actions.push(`<a href="/api/downloads/${job.id}/file">Save file</a>`);
    if (!['running', 'queued'].includes(job.status)) actions.push(`<button data-act="remove">Remove from list</button>`);
    const stats = [
      job.total ? `${human(job.downloaded)} / ${human(job.total)}` : job.downloaded ? human(job.downloaded) : '',
      job.total ? `${pct.toFixed(1)}%` : '',
      job.status === 'running' && job.speed ? `${human(job.speed)}/s` : '',
      job.status === 'running' && job.eta != null ? `${clock(job.eta)} left` : '',
      `${job.connections} conn`,
    ].filter(Boolean);
    return `
      <article class="job" data-id="${job.id}" data-status="${job.status}">
        <div class="row">
          <div class="title">${escapeHtml(job.filename || job.title || 'Finding video...')}</div>
          <span class="status ${job.status}">${escapeHtml(statusLabel(job))}</span>
        </div>
        <div class="url">${escapeHtml(job.url)}</div>
        <div class="bar"><div class="fill${unknown ? ' indeterminate' : ''}" style="width:${job.status === 'done' ? 100 : unknown ? 30 : pct}%"></div></div>
        <div class="stats">${stats.map((s) => `<span>${s}</span>`).join('')}</div>
        ${job.error ? `<div class="err">${escapeHtml(job.error)}</div>` : ''}
        <div class="actions">${actions.join('')}</div>
      </article>`;
  }).join('');
}

async function refresh() {
  try { render(await api('/downloads')); } catch { /* server restarting; try again next tick */ }
}

list.addEventListener('click', async (e) => {
  const button = e.target.closest('button[data-act]');
  if (!button) return;
  const id = button.closest('.job').dataset.id;
  const act = button.dataset.act;
  try {
    if (act === 'remove') await api(`/downloads/${id}`, { method: 'DELETE' });
    else await api(`/downloads/${id}/${act}`, { method: 'POST' });
    banner.textContent = '';
  } catch (err) { banner.textContent = err.message; }
  refresh();
});

document.getElementById('add').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('url');
  try {
    await api('/downloads', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: input.value, connections: Number(document.getElementById('connections').value) }),
    });
    input.value = '';
    banner.textContent = '';
  } catch (err) { banner.textContent = err.message; }
  refresh();
});

api('/info').then((info) => { document.getElementById('folder').textContent = `Saving to ${info.download_dir}`; }).catch(() => {});
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
