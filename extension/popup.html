<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vidgrab</title>
<style>
  :root { --bg: #0b0f17; --panel: #121826; --line: #232c3d; --text: #e6e9ef; --muted: #8a94a7; --accent: #7c3aed; --ok: #22c55e; --err: #f87171; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f7fb; --panel: #fff; --line: #e3e6ee; --text: #151a24; --muted: #5d6678; } }
  body { margin: 0; width: 340px; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0; }
  .status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); } .dot.off { background: var(--err); }
  section { padding: 12px 14px; }
  button { font: inherit; color: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); height: 30px; padding: 0 10px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; width: 100%; height: 36px; }
  button:disabled { opacity: .5; cursor: default; }
  h2 { font-size: 12px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow: auto; }
  li { display: flex; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); font-size: 12px; }
  .msg { min-height: 16px; font-size: 12px; margin-top: 8px; }
  .msg.err { color: var(--err); } .msg.ok { color: var(--ok); }
  details { border-top: 1px solid var(--line); padding: 10px 14px; color: var(--muted); }
  details input { width: 100%; box-sizing: border-box; height: 30px; margin-top: 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 0 8px; }
</style>
</head>
<body>
  <header>
    <h1>vidgrab</h1>
    <span class="status"><span class="dot" id="dot"></span><span id="status">Checking...</span></span>
  </header>
  <section>
    <button class="primary" id="send-page">Download this page's video</button>
    <div class="msg" id="msg" role="status"></div>
    <h2>Media found on this page</h2>
    <ul id="found"></ul>
  </section>
  <details>
    <summary>Connection</summary>
    <label for="server">vidgrab address</label>
    <input id="server" type="url" placeholder="http://127.0.0.1:8765">
  </details>
  <script src="popup.js"></script>
</body>
</html>
